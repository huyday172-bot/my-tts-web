<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khmer TTS Voice</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background-color: #0b0f19; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .card { background: #1e293b; max-width: 450px; width: 100%; padding: 20px; border-radius: 12px; }
    textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; margin-bottom: 15px; }
    select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; margin-bottom: 15px; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }
    audio { width: 100%; margin-top: 20px; display: block; }
    p { text-align: center; color: #38bdf8; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h3 style="text-align:center; margin-top:0;">🇰🇭 បង្កើតសំឡេងខ្មែរ AI</h3>
    <textarea id="my-text">សួស្តីបងប្អូនទាំងអស់គ្នា</textarea>
    
    <select id="speed-val">
      <option value="1">សំឡេងធម្មតា (1x)</option>
      <option value="0.85">សំឡេងយឺត/រំសាយអារម្មណ៍ (0.85x)</option>
      <option value="1.2">សំឡេងលឿន/ព័ត៌មាន (1.2x)</option>
    </select>

    <button id="btn-play">🔊 បង្កើតសំឡេង</button>
    <p id="msg">ចុចប៊ូតុងដើម្បីទាញយកសំឡេង</p>

    <!-- កន្លែងចាក់សំឡេងដែល iPhone អាចលេងបានផ្ទាល់ -->
    <audio id="player" controls playsinline></audio>
  </div>

  <script>
    const btn = document.getElementById('btn-play');
    const player = document.getElementById('player');
    const msg = document.getElementById('msg');

    btn.onclick = function() {
      const text = document.getElementById('my-text').value.trim();
      const speed = document.getElementById('speed-val').value;
      
      if (!text) return alert('សូមវាយអត្ថបទ!');
      
      msg.innerText = 'កំពុងចាក់សំឡេង...';
      const audioUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=km&client=tw-ob&q=' + encodeURIComponent(text);
      
      player.src = audioUrl;
      player.playbackRate = parseFloat(speed);
      
      player.play().catch(function() {
        msg.innerText = 'សូមចុចប៊ូតុង Play (▶) ខាងក្រោមដើម្បីស្ដាប់';
      });
    };
  </script>
</body>
</html>
