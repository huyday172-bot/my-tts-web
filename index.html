<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khmer Multi-Voice TTS</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; padding: 16px; display: flex; justify-content: center; }
    .card { background: #1e293b; max-width: 460px; width: 100%; padding: 22px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: #38bdf8; margin: 0 0 16px 0; font-size: 20px; }
    label { font-size: 13px; color: #94a3b8; font-weight: 600; display: block; margin-top: 14px; margin-bottom: 6px; }
    textarea { width: 100%; height: 110px; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; resize: none; }
    select, input[type="range"] { width: 100%; accent-color: #38bdf8; }
    select { padding: 10px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #fff; font-size: 14px; }
    button { width: 100%; padding: 14px; margin-top: 18px; border: none; border-radius: 8px; background: #2563eb; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #475569; }
    audio { width: 100%; margin-top: 16px; display: block; }
    .info { font-size: 13px; color: #38bdf8; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🇰🇭 ប្រព័ន្ធបង្កើតសំឡេងខ្មែរ</h2>
    
    <label>បញ្ចូលអត្ថបទខ្មែរ៖</label>
    <textarea id="text-input" placeholder="វាយអត្ថបទខ្មែរទីនេះ...">សួស្តីបងប្អូនទាំងអស់គ្នា</textarea>

    <!-- ជ្រើសរើស Style សំឡេង -->
    <label>ជ្រើសរើសទម្រង់សំឡេង (Style)៖</label>
    <select id="style-select">
      <option value="1">👩 សំឡេងស្រី - ធម្មតា (Normal)</option>
      <option value="0.8">📖 សំឡេងអានរឿង - មួយៗរំសាយចិត្ត (Slow)</option>
      <option value="1.25">📰 សំឡេងអានព័ត៌មាន - រហ័សទាន់ចិត្ត (Fast)</option>
      <option value="1.5">🧒 សំឡេងកំប្លែង/ក្មេង - លឿនញាប់ (Very Fast)</option>
    </select>

    <button id="play-btn">🔊 បង្កើត និងចាក់សំឡេង</button>
    <p class="info" id="status-msg">ចុចប៊ូតុងដើម្បីចាក់សំឡេង</p>
    
    <!-- Audio Player សម្រាប់ចាក់ផ្ទាល់លើទូរស័ព្ទ -->
    <audio id="audio-player" controls playsinline></audio>
  </div>

  <script>
    const textInput = document.getElementById('text-input');
    const styleSelect = document.getElementById('style-select');
    const playBtn = document.getElementById('play-btn');
    const audioPlayer = document.getElementById('audio-player');
    const statusMsg = document.getElementById('status-msg');

    playBtn.onclick = function() {
      const text = textInput.value.trim();
      if (!text) {
        alert('សូមបញ្ចូលអត្ថបទជាមុនសិន!');
        return;
      }

      statusMsg.innerText = 'កំពុងទាញយកសំឡេងខ្មែរ...';
      playBtn.disabled = true;

      // ប្រើប្រាស់សេវាសំឡេងខ្មែរផ្ទាល់ (ដំណើរការលើគ្រប់ទូរស័ព្ទ)
      const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=km&client=tw-ob&q=${encodeURIComponent(text)}`;
      
      audioPlayer.src = ttsUrl;
      audioPlayer.playbackRate = parseFloat(styleSelect.value);

      audioPlayer.play().then(() => {
        statusMsg.innerText = 'កំពុងចាក់សំឡេង...';
      }).catch((err) => {
        statusMsg.innerText = 'សូមចុចប៊ូតុង Play (▶) លើ Audio Bar ខាងក្រោមដើម្បីស្ដាប់';
      });

      audioPlayer.onended = () => {
        statusMsg.innerText = 'បានចាក់ចប់រួចរាល់!';
        playBtn.disabled = false;
      };

      playBtn.disabled = false;
    };
  </script>
</body>
</html>
