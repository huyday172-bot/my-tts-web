
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHEA VOICE AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#101010;color:white;
 font-family:Arial,sans-serif;
}
.container{max-width:500px;margin:auto}
header{text-align:center;padding:25px 10px}
h1{color:#e6bd55;margin:0;font-size:28px}
header p{color:#aaa}
.panel{
 background:#1d1d1d;padding:18px;
 border:1px solid #6e5725;
 border-radius:15px;margin-bottom:15px;
}
label{display:block;margin:13px 0 7px;color:#e6bd55}
select,textarea,input{
 width:100%;padding:13px;border-radius:9px;
 border:1px solid #555;background:#292929;
 color:white;font-size:16px;
}
textarea{height:150px;resize:vertical}
button{
 width:100%;padding:14px;margin-top:15px;
 border:0;border-radius:9px;
 background:#d5ad45;color:#171717;
 font-size:17px;font-weight:bold;
}
button:active{opacity:.7}
.small{color:#aaa;font-size:13px;line-height:1.6}
#message{color:#f0ca65;margin-top:12px}
</style>
</head>
<body>
<div class="container">

<header>
<h1>🎙 PHEA VOICE AI</h1>
<p>Khmer AI Voice Studio</p>
</header>

<div class="panel">
<label>ជ្រើសរើសសំឡេង</label>
<select id="voice">
<option value="phanin">Phanin — ស្រី | Natural</option>
<option value="arun">Arun — ប្រុស | Professional</option>
<option value="bopha">Bopha — ស្រី | Warm</option>
<option value="bosba">Bosba — ស្រី | Bright</option>
<option value="davy">Davy — ស្រី | Bright</option>
<option value="heng">Heng — ប្រុស | Bright</option>
<option value="kosal">Kosal — ប្រុស | Warm</option>
<option value="malis">Malis — ស្រី | Warm</option>
<option value="pich">Pich — ប្រុស | Natural</option>
<option value="ratanak">Ratanak — ប្រុស | Warm</option>
<option value="rithy">Rithy — ប្រុស | Bright</option>
<option value="sovann">Sovann — ប្រុស | Professional</option>
<option value="sovanna">Sovanna — ស្រី | Professional</option>
<option value="sreypov">Sreypov — ស្រី | Professional</option>
<option value="vanna">Vanna — ប្រុស | Professional</option>
<option value="bora">Bora — ប្រុស | Bright</option>
<option value="borey">Borey — ប្រុស | Professional</option>
</select>

<label>បញ្ចូលអត្ថបទភាសាខ្មែរ</label>
<textarea id="text" placeholder="សូមវាយអត្ថបទដែលអ្នកចង់បង្កើតជាសំឡេង..."></textarea>

<label>ល្បឿនសំឡេង</label>
<input id="speed" type="range" min="0.5" max="2" step="0.1" value="1">
<p class="small">ល្បឿន៖ <span id="speedValue">1.0</span>x</p>

<button onclick="generateVoice()">បង្កើតសំឡេង</button>
<p id="message" class="small">
សូមភ្ជាប់ API Backend ជាមុនសិន ដើម្បីអាចបង្កើតសំឡេងបាន។
</p>
</div>

<div class="panel">
<label>សំឡេងដែលបានបង្កើត</label>
<audio id="player" controls style="width:100%"></audio>
<p class="small">នៅពេលភ្ជាប់ API រួច អ្នកអាចស្ដាប់ និងទាញយកសំឡេងនៅទីនេះ។</p>
</div>

<p class="small" style="text-align:center">
PHEA VOICE AI © 2026
</p>

</div>

<script>
const speed = document.getElementById("speed");
speed.addEventListener("input",()=>{
 document.getElementById("speedValue").textContent =
 Number(speed.value).toFixed(1);
});

function generateVoice(){
 const text = document.getElementById("text").value.trim();
 if(!text){
  document.getElementById("message").textContent =
  "សូមបញ្ចូលអត្ថបទជាមុនសិន។";
  return;
 }
 document.getElementById("message").textContent =
 "មុខងារបង្កើតសំឡេងត្រូវការភ្ជាប់ LynxTTS API Backend ជាមុនសិន។";
}
</script>
</body>
</html>
