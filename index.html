<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khmer AI TTS</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; padding: 16px; display: flex; justify-content: center; }
    .card { background: #1e293b; max-width: 450px; width: 100%; padding: 22px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2 { text-align: center; color: #38bdf8; margin: 0 0 16px 0; font-size: 20px; }
    label { font-size: 13px; color: #94a3b8; font-weight: 600; display: block; margin-top: 14px; margin-bottom: 6px; }
    textarea { width: 100%; height: 110px; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; resize: none; }
    select { width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #fff; font-size: 14px; }
    button { width: 100%; padding: 14px; margin-top: 18px; border: none; border-radius: 8px; background: #2563eb; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #475569; }
    audio { width: 100%; margin-top: 18px; display: block; }
    .info { font-size: 13px; color: #38bdf8; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🇰🇭 Khmer AI TTS (LynxTTS)</h2>

    <label>បញ្ចូលអត្ថបទខ្មែរ៖</label>
    <textarea id="tts-text">សួស្តីបងប្អូនទាំងអស់គ្នា ខ្ញុំជាសំឡេងបញ្ញាសិប្បនិម្មិត AI</textarea>

    <!-- ជ្រើសរើសសំឡេង AI ខ្មែរ -->
    <label>ជ្រើសរើសសំឡេង (Voices)៖</label>
    <select id="voice-name">
      <option value="km-KH-PiseyNeural">👩 សំឡេងស្រី - ពីសី (Pisey - ផ្អែមរលូន)</option>
      <option value="km-KH-DaNeural">👨 សំឡេងប្រុស - ដារ៉ា (Da - ច្បាស់ម៉ឺងម៉ាត់)</option>
    </select>

    <!-- ជ្រើសរើស Style ល្បឿន -->
    <label>ល្បឿននិយាយ (Speed)៖</label>
    <select id="tts-speed">
      <option value="1">ធម្មតា (Normal - 1x)</option>
      <option value="0.85">មួយៗ រំសាយចិត្ត (Slow - 0.85x)</option>
      <option value="1.2">លឿនបែបព័ត៌មាន (Fast - 1.2x)</option>
    </select>

    <button id="btn-create">🔊 បង្កើត និងចាក់សំឡេង AI</button>
    <p class="info" id="status-text">សូមចុចប៊ូតុងដើម្បីបង្កើតសំឡេង</p>

    <!-- កន្លែងចាក់សំឡេង -->
    <audio id="audio-box" controls playsinline></audio>
  </div>

  <script>
    const btnCreate = document.getElementById('btn-create');
    const ttsText = document.getElementById('tts-text');
    const voiceName = document.getElementById('voice-name');
    const ttsSpeed = document.getElementById('tts-speed');
    const audioBox = document.getElementById('audio-box');
    const statusText = document.getElementById('status-text');

    btnCreate.onclick = function() {
      const text = ttsText.value.trim();
      if (!text) {
        alert('សូមបញ្ចូលអត្ថបទជាមុនសិន!');
        return;
      }

      btnCreate.disabled = true;
      statusText.innerText = 'កំពុងទាញយកសំឡេង AI សូមរង់ចាំ...';

      // ប្រើ API សំឡេងខ្មែរផ្ទាល់ ដែលមិនជាប់ Error CORS
      const soundUrl = `https://api.streamelements.com/kappa/v2/speech?voice=${voiceName.value}&text=${encodeURIComponent(text)}`;

      audioBox.src = soundUrl;
      audioBox.playbackRate = parseFloat(ttsSpeed.value);

      // បញ្ជាឱ្យ Play ពេលទាញយកបាន
      audioBox.load();
      audioBox.play().then(() => {
        statusText.innerText = 'កំពុងចាក់សំឡេង...';
      }).catch((e) => {
        statusText.innerText = 'សំឡេងបង្កើតរួចហើយ! សូមចុចសញ្ញា Play (▶) ខាងក្រោម';
      });

      audioBox.onended = () => {
        statusText.innerText = 'ចាក់ចប់រួចរាល់!';
        btnCreate.disabled = false;
      };

      btnCreate.disabled = false;
    };
  </script>
</body>
</html>
