<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khmer AI Voice Studio</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; padding: 20px 16px; display: flex; justify-content: center; }
    .card { background: #1e1e1e; max-width: 480px; width: 100%; padding: 24px; border-radius: 20px; border: 1px solid #333333; box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
    h2 { text-align: center; color: #e5b869; margin: 0 0 18px 0; font-size: 22px; font-weight: bold; }
    label { font-size: 14px; color: #e5b869; font-weight: 600; display: block; margin-top: 16px; margin-bottom: 8px; }
    select { width: 100%; padding: 12px; border: 1px solid #333333; border-radius: 10px; background: #2a2a2a; color: #ffffff; font-size: 15px; outline: none; }
    .voice-desc { font-size: 13px; color: #9ca3af; margin-top: 6px; font-style: italic; }
    textarea { width: 100%; height: 110px; padding: 12px; background: #2a2a2a; border: 1px solid #333333; border-radius: 10px; color: #ffffff; font-size: 15px; resize: none; outline: none; }
    .slider-container { margin-top: 8px; }
    input[type="range"] { width: 100%; accent-color: #e5b869; }
    .rate-text { color: #e5b869; font-size: 14px; margin-top: 6px; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn-preview { flex: 1; padding: 14px; border: 1px solid #e5b869; border-radius: 10px; background: transparent; color: #e5b869; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-submit { flex: 2; padding: 14px; border: none; border-radius: 10px; background: #e5b869; color: #121212; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-submit:disabled, .btn-preview:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg { text-align: center; font-size: 13px; color: #38bdf8; margin-top: 14px; min-height: 20px; }
    .audio-wrapper { margin-top: 18px; padding-top: 16px; border-top: 1px solid #2e2e2e; }
    audio { width: 100%; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Khmer AI Voice Studio</h2>

    <label>ជ្រើសរើសសំឡេង AI</label>
    <select id="voice-select"></select>
    <div id="voice-desc" class="voice-desc"></div>

    <label>បញ្ចូលអត្ថបទភាសាខ្មែរ</label>
    <textarea id="text-input" placeholder="សូមបញ្ចូលអត្ថបទនៅទីនេះ...">សួស្តីបងប្អូន នេះជាសំឡេងបញ្ញាសិប្បនិម្មិត AI ខ្មែរពិតប្រាកដ</textarea>

    <label>ល្បឿនសំឡេង</label>
    <div class="slider-container">
      <input type="range" id="speed-range" min="0.7" max="1.3" value="1.0" step="0.05">
      <div class="rate-text">ល្បឿន៖ <span id="speed-val">1.0x</span></div>
    </div>

    <div class="btn-row">
      <button class="btn-preview" id="btn-preview">▶️ ស្តាប់គំរូដើម</button>
      <button class="btn-submit" id="btn-generate">បង្កើតសំឡេង AI</button>
    </div>

    <div class="status-msg" id="status">រួចរាល់ដើម្បីដំណើរការ</div>

    <div class="audio-wrapper">
      <audio id="audio-player" controls playsinline></audio>
    </div>
  </div>

  <script>
    const voiceData = [
      { id: "phanin", name: "Phanin — ស្រី | Natural", desc: "ស្ងប់ស្ងាត់ ច្បាស់លាស់ និងផ្តល់ភាពទុកចិត្ត", hash: "219c46eb7bb9", voiceCode: "km-KH-PiseyNeural" },
      { id: "arun", name: "Arun — ប្រុស | Professional", desc: "សំឡេងជ្រៅ មានអំណាច បែបអ្នកអានព័ត៌មាន", hash: "681d03b33e3f", voiceCode: "km-KH-DaNeural" },
      { id: "bopha", name: "Bopha — ស្រី | Warm", desc: "និទានរឿងដោយស្មោះត្រង់ និងពោរពេញដោយអារម្មណ៍", hash: "54783a207db9", voiceCode: "km-KH-PiseyNeural" },
      { id: "bosba", name: "Bosba — ស្រី | Bright", desc: "អ្នកបង្ហាញវ័យក្មេង និងរស់រវើក", hash: "cda00af4520f", voiceCode: "km-KH-PiseyNeural" },
      { id: "davy", name: "Davy — ស្រី | Retail", desc: "សំឡេងលក់រាយស្វាហាប់ និងរួសរាយ", hash: "7146a3b598d6", voiceCode: "km-KH-PiseyNeural" },
      { id: "heng", name: "Heng — ប្រុស | Commercial", desc: "ការនិយាយពាណិជ្ជកម្មប្រកបដោយការបញ្ចុះបញ្ចូល និងស្វាហាប់", hash: "64c4efb6c588", voiceCode: "km-KH-DaNeural" },
      { id: "kosal", name: "Kosal — ប្រុស | Meditative", desc: "ទឹកសំឡេងស្ងប់ មានលំនឹង សម្រាប់សមាធិ", hash: "0a6b073ce0ef", voiceCode: "km-KH-DaNeural" },
      { id: "malis", name: "Malis — ស្រី | Warm Assistant", desc: "ជំនួយការដែលមានប្រយោជន៍ និងងាយស្រួលស្និទ្ធស្នាល", hash: "dca82436c06e", voiceCode: "km-KH-PiseyNeural" },
      { id: "pich", name: "Pich — ប្រុស | Natural Modern", desc: "ការសន្ទនាទំនើប និងមានទំនុកចិត្ត", hash: "c477d81bc7ef", voiceCode: "km-KH-DaNeural" },
      { id: "ratanak", name: "Ratanak — ប្រុស | Cultural Narration", desc: "ការរៀបរាប់បែបវប្បធម៌យ៉ាងសម្បូរបែប", hash: "971d920b7d3d", voiceCode: "km-KH-DaNeural" }
    ];

    const voiceSelect = document.getElementById('voice-select');
    const voiceDesc = document.getElementById('voice-desc');
    const textInput = document.getElementById('text-input');
    const speedRange = document.getElementById('speed-range');
    const speedVal = document.getElementById('speed-val');
    const btnGenerate = document.getElementById('btn-generate');
    const btnPreview = document.getElementById('btn-preview');
    const status = document.getElementById('status');
    const audioPlayer = document.getElementById('audio-player');

    voiceData.forEach((v, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = v.name;
      voiceSelect.appendChild(opt);
    });

    function updateVoiceInfo() {
      voiceDesc.textContent = voiceData[voiceSelect.value].desc;
    }
    voiceSelect.onchange = updateVoiceInfo;
    updateVoiceInfo();

    speedRange.oninput = () => {
      speedVal.innerText = parseFloat(speedRange.value).toFixed(2) + 'x';
    };

    // ១. ចាក់សំឡេងគំរូដើម LynxTTS
    btnPreview.onclick = () => {
      const selected = voiceData[voiceSelect.value];
      status.innerText = `កំពុងចាក់សំឡេងគំរូ៖ ${selected.name}...`;
      audioPlayer.src = `https://lynxtts.com/voice-previews/${selected.id}.mp3?v=${selected.hash}`;
      audioPlayer.playbackRate = 1.0;
      audioPlayer.load();
      audioPlayer.play().catch(() => {
        status.innerText = 'ចុចសញ្ញា Play (▶) ខាងក្រោមដើម្បីស្ដាប់';
      });
    };

    // ២. បង្កើតសំឡេង Neural AI ពិតប្រាកដ (លែងប្រើ Google Translate Robot)
    btnGenerate.onclick = async () => {
      const text = textInput.value.trim();
      const selected = voiceData[voiceSelect.value];
      const speed = parseFloat(speedRange.value);

      if (!text) {
        alert('សូមបញ្ចូលអត្ថបទជាមុនសិន!');
        return;
      }

      btnGenerate.disabled = true;
      status.innerText = 'កំពុងទាញយកសំឡេង AI ធម្មជាតិ...';

      // គណនាល្បឿនសម្រាប់ Edge-TTS (ឧទាហរណ៍៖ +10% ឬ -10%)
      const ratePercent = Math.round((speed - 1) * 100);
      const rateStr = (ratePercent >= 0 ? `+${ratePercent}%` : `${ratePercent}%`);

      // ហៅ Edge-TTS Proxy Endpoint ដែលបង្កើតសំឡេង Neural ខ្មែរឥតគិតថ្លៃ
      const ttsApiUrl = `https://tts.cykerway.top/tts?voice=${selected.voiceCode}&text=${encodeURIComponent(text)}&rate=${encodeURIComponent(rateStr)}`;

      audioPlayer.src = ttsApiUrl;
      audioPlayer.load();

      audioPlayer.play().then(() => {
        status.innerText = `កំពុងចាក់សំឡេង AI៖ ${selected.name}`;
      }).catch(() => {
        status.innerText = 'សំឡេងបង្កើតរួចរាល់! សូមចុច Play (▶) ដើម្បីស្ដាប់';
      });

      btnGenerate.disabled = false;
    };
  </script>
</body>
</html>
