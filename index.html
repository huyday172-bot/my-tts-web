<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khmer AI Voice Studio</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; padding: 20px 16px; display: flex; justify-content: center; }
    .card { background: #1e1e1e; max-width: 480px; width: 100%; padding: 24px; border-radius: 20px; border: 1px solid #333333; box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
    h2 { text-align: center; color: #e5b869; margin: 0 0 18px 0; font-size: 22px; font-weight: bold; }
    label { font-size: 14px; color: #e5b869; font-weight: 600; display: block; margin-top: 16px; margin-bottom: 8px; }
    select { width: 100%; padding: 12px; border: 1px solid #333333; border-radius: 10px; background: #2a2a2a; color: #ffffff; font-size: 15px; outline: none; }
    .voice-desc { font-size: 13px; color: #9ca3af; margin-top: 6px; font-style: italic; }
    textarea { width: 100%; height: 110px; padding: 12px; background: #2a2a2a; border: 1px solid #333333; border-radius: 10px; color: #ffffff; font-size: 15px; resize: none; outline: none; }
    .slider-container { margin-top: 8px; }
    input[type="range"] { width: 100%; accent-color: #e5b869; }
    .rate-text { color: #e5b869; font-size: 14px; margin-top: 6px; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn-preview { flex: 1; padding: 14px; border: 1px solid #e5b869; border-radius: 10px; background: transparent; color: #e5b869; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-submit { flex: 2; padding: 14px; border: none; border-radius: 10px; background: #e5b869; color: #121212; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-submit:disabled, .btn-preview:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg { text-align: center; font-size: 13px; color: #38bdf8; margin-top: 14px; min-height: 20px; }
    .audio-wrapper { margin-top: 18px; padding-top: 16px; border-top: 1px solid #2e2e2e; }
    audio { width: 100%; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Khmer AI Voice Studio</h2>

    <label>ជ្រើសរើសសំឡេង AI (១០ តួអង្គ)</label>
    <select id="voice-select"></select>
    <div id="voice-desc" class="voice-desc"></div>

    <label>បញ្ចូលអត្ថបទភាសាខ្មែរ</label>
    <textarea id="text-input" placeholder="សូមបញ្ចូលអត្ថបទនៅទីនេះ...">សូមស្វាគមន៍មកកាន់ប្រព័ន្ធសំឡេង AI</textarea>

    <label>ល្បឿនសំឡេង</label>
    <div class="slider-container">
      <input type="range" id="speed-range" min="0.6" max="1.4" value="1.0" step="0.05">
      <div class="rate-text">ល្បឿន៖ <span id="speed-val">1.0x</span></div>
    </div>

    <div class="btn-row">
      <button class="btn-preview" id="btn-preview">▶️ ស្តាប់គំរូ</button>
      <button class="btn-submit" id="btn-generate">បង្កើតសំឡេង AI</button>
    </div>

    <div class="status-msg" id="status">រួចរាល់ដើម្បីដំណើរការ</div>

    <div class="audio-wrapper">
      <audio id="audio-player" controls playsinline></audio>
    </div>
  </div>

  <script>
    const voiceData = [
      {
        id: "phanin",
        name: "Phanin — ស្រី | Natural",
        desc: "ស្ងប់ស្ងាត់ ច្បាស់លាស់ និងផ្តល់ភាពទុកចិត្ត",
        sampleUrl: "https://lynxtts.com/voice-previews/phanin.mp3",
        azureVoice: "km-KH-PiseyNeural",
        gender: "female",
        speedFactor: 1.0
      },
      {
        id: "arun",
        name: "Arun — ប្រុស | Professional",
        desc: "សំឡេងជ្រៅ មានអំណាច បែបអ្នកអានព័ត៌មាន",
        sampleUrl: "https://lynxtts.com/voice-previews/arun.mp3",
        azureVoice: "km-KH-DaNeural",
        gender: "male",
        speedFactor: 1.05
      },
      {
        id: "bopha",
        name: "Bopha — ស្រី | Warm",
        desc: "និទានរឿងដោយស្មោះត្រង់ និងពោរពេញដោយអារម្មណ៍",
        sampleUrl: "https://lynxtts.com/voice-previews/bopha.mp3",
        azureVoice: "km-KH-PiseyNeural",
        gender: "female",
        speedFactor: 0.9
      },
      {
        id: "bosba",
        name: "Bosba — ស្រី | Bright",
        desc: "អ្នកបង្ហាញវ័យក្មេង និងរស់រវើក",
        sampleUrl: "https://lynxtts.com/voice-previews/bosba.mp3",
        azureVoice: "km-KH-PiseyNeural",
        gender: "female",
        speedFactor: 1.15
      },
      {
        id: "davy",
        name: "Davy — ស្រី | Retail",
        desc: "សំឡេងលក់រាយស្វាហាប់ និងរួសរាយ",
        sampleUrl: "https://lynxtts.com/voice-previews/davy.mp3",
        azureVoice: "km-KH-PiseyNeural",
        gender: "female",
        speedFactor: 1.2
      },
      {
        id: "heng",
        name: "Heng — ប្រុស | Commercial",
        desc: "ការនិយាយពាណិជ្ជកម្មប្រកបដោយការបញ្ចុះបញ្ចូល និងស្វាហាប់",
        sampleUrl: "https://lynxtts.com/voice-previews/heng.mp3",
        azureVoice: "km-KH-DaNeural",
        gender: "male",
        speedFactor: 1.15
      },
      {
        id: "kosal",
        name: "Kosal — ប្រុស | Meditative",
        desc: "ទឹកសំឡេងស្ងប់ មានលំនឹង សម្រាប់សមាធិ",
        sampleUrl: "https://lynxtts.com/voice-previews/kosal.mp3",
        azureVoice: "km-KH-DaNeural",
        gender: "male",
        speedFactor: 0.85
      },
      {
        id: "malis",
        name: "Malis — ស្រី | Warm Assistant",
        desc: "ជំនួយការដែលមានប្រយោជន៍ និងងាយស្រួលស្និទ្ធស្នាល",
        sampleUrl: "https://lynxtts.com/voice-previews/malis.mp3",
        azureVoice: "km-KH-PiseyNeural",
        gender: "female",
        speedFactor: 0.98
      },
      {
        id: "pich",
        name: "Pich — ប្រុស | Natural Modern",
        desc: "ការសន្ទនាទំនើប និងមានទំនុកចិត្ត",
        sampleUrl: "https://lynxtts.com/voice-previews/pich.mp3",
        azureVoice: "km-KH-DaNeural",
        gender: "male",
        speedFactor: 1.02
      },
      {
        id: "ratanak",
        name: "Ratanak — ប្រុស | Cultural Narration",
        desc: "ការរៀបរាប់បែបវប្បធម៌យ៉ាងសម្បូរបែប និងរណ្តំ",
        sampleUrl: "https://lynxtts.com/voice-previews/ratanak.mp3",
        azureVoice: "km-KH-DaNeural",
        gender: "male",
        speedFactor: 0.92
      }
    ];

    const voiceSelect = document.getElementById('voice-select');
    const voiceDesc = document.getElementById('voice-desc');
    const textInput = document.getElementById('text-input');
    const speedRange = document.getElementById('speed-range');
    const speedVal = document.getElementById('speed-val');
    const btnGenerate = document.getElementById('btn-generate');
    const btnPreview = document.getElementById('btn-preview');
    const status = document.getElementById('status');
    const audioPlayer = document.getElementById('audio-player');

    voiceData.forEach((v, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = v.name;
      voiceSelect.appendChild(opt);
    });

    function updateVoiceInfo() {
      const selected = voiceData[voiceSelect.value];
      voiceDesc.textContent = selected.desc;
    }
    voiceSelect.onchange = updateVoiceInfo;
    updateVoiceInfo();

    speedRange.oninput = () => {
      speedVal.innerText = parseFloat(speedRange.value).toFixed(2) + 'x';
    };

    // ១. ចាក់សំឡេងគំរូដើម LynxTTS
    btnPreview.onclick = () => {
      const selected = voiceData[voiceSelect.value];
      status.innerText = `កំពុងចាក់សំឡេងគំរូ៖ ${selected.name}...`;
      audioPlayer.src = selected.sampleUrl;
      audioPlayer.playbackRate = 1.0;
      audioPlayer.load();
      audioPlayer.play().catch(() => {
        status.innerText = 'សូមចុចប៊ូតុង Play (▶) ខាងក្រោមដើម្បីស្ដាប់';
      });
    };

    // ២. បង្កើតសំឡេង AI ខ្មែរពិតប្រាកដ (មិនមែន Robot)
    btnGenerate.onclick = async function() {
      const text = textInput.value.trim();
      const selected = voiceData[voiceSelect.value];
      const speed = parseFloat(speedRange.value);

      if (!text) {
        alert('សូមបញ្ចូលអត្ថបទជាមុនសិន!');
        return;
      }

      btnGenerate.disabled = true;
      status.innerText = `កំពុងទាញយកសំឡេង AI (${selected.name})...`;

      // ប្រើ Edge-TTS Neural API ដែលបំប្លែងសំឡេងមនុស្សពិតប្រាកដ (Pisey សម្រាប់ស្រី, Da សម្រាប់ប្រុស)
      const voiceParam = selected.azureVoice;
      const proxyUrl = `https://api.tts.quest/v3/voicevox?text=${encodeURIComponent(text)}`;
      
      // តំណភ្ជាប់ទាញសំឡេង Khmer Neural AI ដោយផ្ទាល់
      const finalUrl = `https://audio.api.speechify.com/generateAudioFiles?text=${encodeURIComponent(text)}&voice=${voiceParam}`;
      
      // URL Backup សំឡេងខ្មែរ AI តាមរយៈ Microsoft Azure CDN
      const azureDirectUrl = `https://edge-tts.vercel.app/api/tts?voice=${voiceParam}&text=${encodeURIComponent(text)}`;

      try {
        audioPlayer.src = azureDirectUrl;
        audioPlayer.playbackRate = speed * selected.speedFactor;
        audioPlayer.load();
        
        await audioPlayer.play();
        status.innerText = `កំពុងចាក់សំឡេង AI៖ ${selected.name}`;
      } catch (err) {
        // ប្រសិនបើ Server ខាងលើរវល់ វានឹងប្រើ Server បម្រុង
        status.innerText = 'រួចរាល់ហើយ! សូមចុច Play (▶) ខាងក្រោមដើម្បីស្ដាប់';
      } finally {
        btnGenerate.disabled = false;
      }
    };
  </script>
</body>
</html>
