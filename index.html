<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khmer AI Voice Studio</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; padding: 20px 16px; display: flex; justify-content: center; }
    .card { background: #1e1e1e; max-width: 450px; width: 100%; padding: 24px; border-radius: 20px; border: 1px solid #333333; box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
    h2 { text-align: center; color: #e5b869; margin: 0 0 20px 0; font-size: 20px; font-weight: bold; }
    label { font-size: 14px; color: #e5b869; font-weight: 600; display: block; margin-top: 16px; margin-bottom: 8px; }
    select { width: 100%; padding: 12px; border: 1px solid #333333; border-radius: 10px; background: #2a2a2a; color: #ffffff; font-size: 15px; outline: none; }
    textarea { width: 100%; height: 120px; padding: 12px; background: #2a2a2a; border: 1px solid #333333; border-radius: 10px; color: #ffffff; font-size: 15px; resize: none; outline: none; }
    .slider-container { margin-top: 8px; }
    input[type="range"] { width: 100%; accent-color: #3b82f6; height: 6px; background: #444; border-radius: 4px; }
    .rate-text { color: #e5b869; font-size: 14px; margin-top: 8px; }
    .btn-submit { width: 100%; padding: 15px; margin-top: 22px; border: none; border-radius: 10px; background: #e5b869; color: #121212; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-submit:disabled { background: #555555; color: #888888; cursor: not-allowed; }
    .status-msg { text-align: center; font-size: 13px; color: #a0a0a0; margin-top: 12px; }
    .audio-wrapper { margin-top: 20px; padding-top: 16px; border-top: 1px solid #2e2e2e; }
    audio { width: 100%; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Khmer AI Voice Studio</h2>

    <!-- ជ្រើសរើសសំឡេង -->
    <label>ជ្រើសរើសសំឡេង</label>
    <select id="voice-select">
      <option value="km-KH-PiseyNeural">Phanin — ស្រី | Natural (ពីសី)</option>
      <option value="km-KH-DaNeural">Dara — ប្រុស | Natural (ដារ៉ា)</option>
    </select>

    <!-- ប្រអប់បញ្ចូលអត្ថបទ -->
    <label>បញ្ចូលអត្ថបទភាសាខ្មែរ</label>
    <textarea id="text-input" placeholder="សូមបញ្ចូលអត្ថបទនៅទីនេះ...">បាទ សូមជម្រាបសួរ</textarea>

    <!-- កំណត់ល្បឿន -->
    <label>ល្បឿនសំឡេង</label>
    <div class="slider-container">
      <input type="range" id="speed-range" min="0.5" max="1.5" value="1.0" step="0.1">
      <div class="rate-text">ល្បឿន៖ <span id="speed-val">1.0x</span></div>
    </div>

    <!-- ប៊ូតុងដំណើរការ -->
    <button class="btn-submit" id="btn-generate">បង្កើតសំឡេង</button>
    <div class="status-msg" id="status">រួចរាល់ដើម្បីបង្កើតសំឡេង</div>

    <!-- Audio Player ចាក់សំឡេង -->
    <div class="audio-wrapper">
      <audio id="audio-player" controls playsinline></audio>
    </div>
  </div>

  <script>
    const voiceSelect = document.getElementById('voice-select');
    const textInput = document.getElementById('text-input');
    const speedRange = document.getElementById('speed-range');
    const speedVal = document.getElementById('speed-val');
    const btnGenerate = document.getElementById('btn-generate');
    const status = document.getElementById('status');
    const audioPlayer = document.getElementById('audio-player');

    // អាប់ដេតលេខល្បឿនពេលអូស Slider
    speedRange.oninput = () => {
      speedVal.innerText = parseFloat(speedRange.value).toFixed(1) + 'x';
    };

    // មុខងារហៅ API បង្កើតសំឡេងពេលចុចប៊ូតុង
    btnGenerate.onclick = async () => {
      const text = textInput.value.trim();
      const voice = voiceSelect.value;
      const speed = parseFloat(speedRange.value);

      if (!text) {
        alert('សូមបញ្ចូលអត្ថបទជាមុនសិន!');
        return;
      }

      btnGenerate.disabled = true;
      status.innerText = 'កំពុងតភ្ជាប់ API និងបង្កើតសំឡេង...';

      try {
        // តំណភ្ជាប់ Edge TTS API ឥតគិតថ្លៃ (StreamElements Endpoint)
        const apiUrl = `https://api.streamelements.com/kappa/v2/speech?voice=${voice}&text=${encodeURIComponent(text)}`;

        audioPlayer.src = apiUrl;
        audioPlayer.playbackRate = speed;

        // ចាក់សំឡេង
        await audioPlayer.play();
        status.innerText = 'កំពុងចាក់សំឡេងខ្មែរ AI!';
      } catch (err) {
        status.innerText = 'បង្កើតសំឡេងបានហើយ! សូមចុចលើប៊ូតុង Play (▶) ខាងក្រោមដើម្បីស្ដាប់';
      } finally {
        btnGenerate.disabled = false;
      }
    };
  </script>
</body>
</html>
